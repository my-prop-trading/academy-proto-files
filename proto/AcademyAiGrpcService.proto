syntax = "proto3";
package academy_ai;
import "google/protobuf/empty.proto";

// Chart analysis explains what a chart shows; it carries no entries, stops, targets or advice.
// Analyses are visible only to their client: a foreign or unknown id reads as absent.

message TrendGrpcModel {
  string Direction = 1;        // "up", "down" or "sideways"
  string Explanation = 2;
}

message VolatilityGrpcModel {
  string Level = 1;            // "low", "medium" or "high"
  string Explanation = 2;
}

message PatternGrpcModel {
  string Name = 1;
  string Explanation = 2;
}

message LevelsGrpcModel {
  optional string Support = 1;     // decimal string
  optional string Resistance = 2;  // decimal string
  string Explanation = 3;
}

message ChartAnalysisGrpcModel {
  string Id = 1;
  string ClientId = 2;
  optional string Ticker = 3;
  optional string Timeframe = 4;
  TrendGrpcModel Trend = 5;
  VolatilityGrpcModel Volatility = 6;
  optional PatternGrpcModel Pattern = 7;
  optional LevelsGrpcModel Levels = 8;
  string Summary = 9;
  int64 CreatedAt = 10;
}

message DailyUsageGrpcModel {
  int32 Used = 1;
  int32 DailyLimit = 2;
  int64 ExtraPriceCoins = 3;   // coins per use over the limit; 0 when not for sale
}

message AiRewardGrpcModel {
  int64 Coins = 1;
  int64 Xp = 2;
}

message AnalyzeChartRequest {
  string ClientId = 1;
  bytes Image = 2;
  string MediaType = 3;        // image/png, image/jpeg or image/webp
  bool PayWithCoins = 4;       // over the daily limit, pay ExtraPriceCoins for a stored analysis
}

enum AnalyzeChartStatusGrpc {
  ANALYZE_CHART_OK = 0;
  ANALYZE_CHART_NOT_A_CHART = 1;       // limit not spent
  ANALYZE_CHART_LIMIT_REACHED = 2;
  ANALYZE_CHART_AI_FAILURE = 3;        // limit not spent; safe to retry
  ANALYZE_CHART_NOT_CONFIGURED = 4;
  ANALYZE_CHART_INVALID_IMAGE = 5;     // unsupported type or empty
  ANALYZE_CHART_NOT_ENOUGH_COINS = 6;  // over the limit with PayWithCoins; nothing charged
}

message AnalyzeChartResponse {
  AnalyzeChartStatusGrpc Status = 1;
  optional ChartAnalysisGrpcModel Analysis = 2;  // set on OK
  DailyUsageGrpcModel Usage = 3;                 // after the call
  AiRewardGrpcModel Reward = 4;                  // credited by this call
  int64 PaidCoins = 5;                           // debited by this call
}

message GetDailyUsageRequest {
  string ClientId = 1;
}

// Newest first.
message ListAnalysesRequest {
  string ClientId = 1;
  int32 Limit = 2;
  int32 Offset = 3;
}

message ListAnalysesResponse {
  repeated ChartAnalysisGrpcModel Analyses = 1;
  int64 Total = 2;
}

message GetAnalysisRequest {
  string ClientId = 1;
  string AnalysisId = 2;
}

message GetAnalysisResponse {
  optional ChartAnalysisGrpcModel Analysis = 1;
}

message AnalysisImageGrpcModel {
  string MediaType = 1;
  bytes Data = 2;
}

message GetAnalysisImageResponse {
  optional AnalysisImageGrpcModel Image = 1;
}

// Mentor is one continuous chat per client about trading education and the product; it gives
// no buy/sell advice or personal allocations. A question is stored only together with its answer.

enum MentorRoleGrpc {
  MENTOR_ROLE_USER = 0;
  MENTOR_ROLE_ASSISTANT = 1;
}

message MentorMessageGrpcModel {
  string Id = 1;
  MentorRoleGrpc Role = 2;
  string Text = 3;
  repeated string HelpRefs = 4;  // help topics: cancel_subscription, refund, sign_in, about, charges
  int64 CreatedAt = 5;
}

message SendMentorMessageRequest {
  string ClientId = 1;
  string Text = 2;
}

enum SendMentorMessageStatusGrpc {
  SEND_MENTOR_MESSAGE_OK = 0;
  SEND_MENTOR_MESSAGE_INVALID_TEXT = 1;    // empty or too long
  SEND_MENTOR_MESSAGE_LIMIT_REACHED = 2;
  SEND_MENTOR_MESSAGE_AI_FAILURE = 3;      // limit not spent, nothing stored; safe to retry
  SEND_MENTOR_MESSAGE_NOT_CONFIGURED = 4;
}

message SendMentorMessageResponse {
  SendMentorMessageStatusGrpc Status = 1;
  optional MentorMessageGrpcModel Question = 2;  // set on OK
  optional MentorMessageGrpcModel Answer = 3;    // set on OK
  DailyUsageGrpcModel Usage = 4;                 // after the call
}

message GetMentorDailyUsageRequest {
  string ClientId = 1;
}

// Newest first.
message ListMentorMessagesRequest {
  string ClientId = 1;
  int32 Limit = 2;
  int32 Offset = 3;
}

message ListMentorMessagesResponse {
  repeated MentorMessageGrpcModel Messages = 1;
  int64 Total = 2;
}

// Settings of the AI tools, edited in academy-admin; code defaults apply until first saved.
message AiSettingsGrpcModel {
  string AnalyzerModel = 1;              // one of GetAiSettingsResponse.Models
  int32 AnalyzerDailyLimit = 2;
  uint32 AnalyzerMaxTokens = 3;
  int32 AnalysisRewardDailyCap = 4;      // free analyses of a day that earn the AI analysis reward
  int64 AnalysisExtraPriceCoins = 5;     // per analysis over the daily limit; 0 takes it off sale
  string MentorModel = 6;
  int32 MentorDailyLimit = 7;
  uint32 MentorMaxTokens = 8;
  int32 MentorContextMessages = 9;       // latest chat messages sent with a new question
}

message GetAiSettingsResponse {
  AiSettingsGrpcModel Settings = 1;
  repeated string Models = 2;            // accepted model names
  optional int64 UpdatedAt = 3;          // absent while code defaults apply
}

enum SetAiSettingsStatusGrpc {
  SET_AI_SETTINGS_OK = 0;
  SET_AI_SETTINGS_INVALID = 1;           // unknown model, negative value or zero max tokens
}

message SetAiSettingsResponse {
  SetAiSettingsStatusGrpc Status = 1;
}

// One model call; CostUsd is computed from the tokens and the prices of the call.
message LlmCallGrpcModel {
  string Id = 1;
  string ClientId = 2;
  string Feature = 3;                    // chart_analysis or mentor
  string Model = 4;
  string PromptVersion = 5;
  string Outcome = 6;                    // "ok", a refusal such as "not_a_chart", or the failure
  optional string AnalysisId = 7;
  optional string MessageId = 8;
  int64 InputTokens = 9;
  int64 OutputTokens = 10;
  int64 CacheCreationInputTokens = 11;
  int64 CacheReadInputTokens = 12;
  double CostUsd = 13;
  int64 LatencyMs = 14;
  int64 CreatedAt = 15;
}

// Newest first; unset filters match every call.
message ListLlmCallsRequest {
  optional string ClientId = 1;
  optional string Feature = 2;
  optional bool Ok = 3;                  // true: outcome "ok"; false: any other outcome
  optional int64 From = 4;               // created at or after
  optional int64 To = 5;                 // created before
  int32 Limit = 6;
  int32 Offset = 7;
}

message ListLlmCallsResponse {
  repeated LlmCallGrpcModel Calls = 1;
  int64 Total = 2;
}

// Totals per UTC day and feature of the calls created in [From, To), newest day first.
message GetLlmUsageRequest {
  int64 From = 1;
  int64 To = 2;
}

message LlmUsageGrpcModel {
  string Day = 1;                        // YYYY-MM-DD, UTC
  string Feature = 2;
  int64 Calls = 3;
  int64 OkCalls = 4;
  int64 InputTokens = 5;                 // uncached, cache writes and cache reads together
  int64 OutputTokens = 6;
  double CostUsd = 7;
}

message GetLlmUsageResponse {
  repeated LlmUsageGrpcModel Rows = 1;
}

service AcademyAiGrpcService {
  rpc AnalyzeChart(AnalyzeChartRequest) returns (AnalyzeChartResponse);
  rpc GetDailyUsage(GetDailyUsageRequest) returns (DailyUsageGrpcModel);
  rpc ListAnalyses(ListAnalysesRequest) returns (ListAnalysesResponse);
  rpc GetAnalysis(GetAnalysisRequest) returns (GetAnalysisResponse);
  rpc GetAnalysisImage(GetAnalysisRequest) returns (GetAnalysisImageResponse);

  rpc SendMentorMessage(SendMentorMessageRequest) returns (SendMentorMessageResponse);
  rpc GetMentorDailyUsage(GetMentorDailyUsageRequest) returns (DailyUsageGrpcModel);
  rpc ListMentorMessages(ListMentorMessagesRequest) returns (ListMentorMessagesResponse);

  rpc GetAiSettings(google.protobuf.Empty) returns (GetAiSettingsResponse);
  rpc SetAiSettings(AiSettingsGrpcModel) returns (SetAiSettingsResponse);
  rpc ListLlmCalls(ListLlmCallsRequest) returns (ListLlmCallsResponse);
  rpc GetLlmUsage(GetLlmUsageRequest) returns (GetLlmUsageResponse);

  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
}
