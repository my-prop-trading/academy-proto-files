syntax = "proto3";
package academy_subscriptions;
import "google/protobuf/empty.proto";

enum AcademySubscriptionStatusGrpc {
  ACTIVE = 0;
  SUSPENDED = 1;
  CANCELLED = 2;
  BLOCKED = 3;
}

message AcademySubscriptionGrpcModel {
  string Id = 1;
  string ClientId = 2;
  string ExternalId = 3;
  AcademySubscriptionStatusGrpc Status = 4;
  string ProductCode = 5;
  int64 StartedAt = 6;
  optional int64 ExpiresAt = 7;
  optional int64 CancelledAt = 8;
  int64 CreatedAt = 9;
  int64 UpdatedAt = 10;
}

message GetByClientIdRequest {
  string ClientId = 1;
}

message GetSubscriptionResponse {
  optional AcademySubscriptionGrpcModel Subscription = 1;
}

enum CancelSubscriptionStatusGrpc {
  CANCEL_OK = 0;
  CANCEL_NOT_FOUND = 1;
  CANCEL_NO_BUYER = 2;
  CANCEL_NOT_ACTIVE = 3;
}

message CancelSubscriptionRequest {
  string ClientId = 1;
  string Ip = 2;
}

message CancelSubscriptionResponse {
  CancelSubscriptionStatusGrpc Status = 1;
}

message CreateSubscriptionRequest {
  string ClientId = 1;
  string ProductCode = 2;
  string ExternalSubscriptionId = 3;
  optional int64 ExpiresAt = 4;
}

message CreateSubscriptionResponse {
  AcademySubscriptionGrpcModel Subscription = 1;
}

message ListSubscriptionsRequest {
  int32 Limit = 1;
  int32 Offset = 2;
  optional AcademySubscriptionStatusGrpc Status = 3;
  optional string Id = 4;
  optional string ClientId = 5;
  optional string ExternalId = 6;
}

message ListSubscriptionsResponse {
  repeated AcademySubscriptionGrpcModel Subscriptions = 1;
}

message GetSubscriptionsStatsResponse {
  int64 Total = 1;
  int64 Active = 2;
  int64 Suspended = 3;
  int64 Cancelled = 4;
  int64 Blocked = 5;
}

enum UpdateSubscriptionStatusGrpc {
  UPDATE_OK = 0;
  UPDATE_NOT_FOUND = 1;
}

// Partial update. None field = keep current value.
// For optional/nullable fields (ExpiresAt, CancelledAt) use the matching
// Clear* bool to explicitly set the field to null.
message UpdateSubscriptionRequest {
  string Id = 1;
  optional AcademySubscriptionStatusGrpc Status = 2;
  optional string ProductCode = 3;
  optional string ExternalId = 4;
  optional int64 StartedAt = 5;
  optional int64 ExpiresAt = 6;
  bool ClearExpiresAt = 7;
  optional int64 CancelledAt = 8;
  bool ClearCancelledAt = 9;
}

message UpdateSubscriptionResponse {
  UpdateSubscriptionStatusGrpc Status = 1;
  optional AcademySubscriptionGrpcModel Subscription = 2;
}

service AcademySubscriptionsGrpcService {
  rpc GetByClientId(GetByClientIdRequest) returns (GetSubscriptionResponse);
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse);
  rpc CreateSubscription(CreateSubscriptionRequest) returns (CreateSubscriptionResponse);
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc GetSubscriptionsStats(google.protobuf.Empty) returns (GetSubscriptionsStatsResponse);
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (UpdateSubscriptionResponse);
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
}
