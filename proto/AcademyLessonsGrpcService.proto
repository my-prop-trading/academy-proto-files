syntax = "proto3";
package academy_lessons;
import "google/protobuf/empty.proto";

message AcademyLessonProgressGrpcModel {
  string ClientId = 1;
  string LessonId = 2;
  map<string, string> Answers = 3;
  int64 CompletedAt = 4;
}

// Lesson ids: a lesson or quiz question id of a course ("<course id>.<slug>"), or a legacy
// frontend id mapped to one at import. Once any course exists, other ids are refused.
enum LessonIdStatusGrpc {
  LESSON_ID_OK = 0;
  LESSON_ID_NOT_FOUND = 1;
}

message MarkLessonCompletedRequest {
  string ClientId = 1;
  string LessonId = 2;
  map<string, string> Answers = 3;
}

message MarkLessonCompletedResponse {
  LessonIdStatusGrpc Status = 1;
  string LessonId = 2;   // course id the request id resolves to; the request id before any course exists
}

message GetCompletedLessonsRequest {
  string ClientId = 1;
}

message GetCompletedLessonsResponse {
  repeated string LessonIds = 1;   // ids as stored plus the course ids that stored legacy ids map to
}

message GetLessonProgressRequest {
  string ClientId = 1;
  string LessonId = 2;
}

message GetLessonProgressResponse {
  optional AcademyLessonProgressGrpcModel Progress = 1;
}

message AddStudyTimeRequest {
  string ClientId = 1;
  string LessonId = 2;
  int32 Seconds = 3;   // active seconds to add (one heartbeat increment)
}

message AddStudyTimeResponse {
  LessonIdStatusGrpc Status = 1;
}

message StudyTimeDayGrpcModel {
  int32 Day = 1;       // YYYYMMDD (UTC)
  int64 Seconds = 2;
}

message StudyTimeLessonGrpcModel {
  string LessonId = 1;
  int64 Seconds = 2;
}

message GetStudyTimeRequest {
  string ClientId = 1;
}

message GetStudyTimeResponse {
  int64 TotalSeconds = 1;
  repeated StudyTimeDayGrpcModel ByDay = 2;
  repeated StudyTimeLessonGrpcModel ByLesson = 3;
}

message GetLessonsRankRequest {
  string ClientId = 1;
}

message GetLessonsRankResponse {
  int64 CompletedCount = 1;   // lessons this client has completed
  int64 TotalLearners = 2;    // clients with >= 1 completed lesson
  int32 BetterThanPercent = 3; // % of learners who completed fewer lessons than this client (0..100)
}

// Rewrites stored legacy ids to course ids; repeatable.
message MigrateLegacyProgressResponse {
  int64 ProgressRows = 1;    // completion rows written under course ids
  int64 StudyTimeRows = 2;   // study time rows written under course ids
}

service AcademyLessonsGrpcService {
  rpc MarkLessonCompleted(MarkLessonCompletedRequest) returns (MarkLessonCompletedResponse);
  rpc GetCompletedLessons(GetCompletedLessonsRequest) returns (GetCompletedLessonsResponse);
  rpc GetLessonProgress(GetLessonProgressRequest) returns (GetLessonProgressResponse);
  rpc AddStudyTime(AddStudyTimeRequest) returns (AddStudyTimeResponse);
  rpc GetStudyTime(GetStudyTimeRequest) returns (GetStudyTimeResponse);
  rpc GetLessonsRank(GetLessonsRankRequest) returns (GetLessonsRankResponse);
  rpc MigrateLegacyProgress(google.protobuf.Empty) returns (MigrateLegacyProgressResponse);
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
}
