syntax = "proto3";
package academy_clients;
import "google/protobuf/empty.proto";

message AcademyClientGrpcModel {
  string Id = 1;
  string Email = 2;
  bool HasPassword = 3;
  int64 CreatedAt = 4;
  int64 UpdatedAt = 5;
  optional string ExternalId = 6;
  optional string FirstName = 7;
  optional string LastName = 8;
}

message CreateClientIfNotExistsRequest {
  string Email = 1;
}

message CreateClientIfNotExistsResponse {
  AcademyClientGrpcModel Client = 1;
  bool Created = 2;
}

enum SetPasswordStatusGrpc {
  SET_PASSWORD_OK = 0;
  SET_PASSWORD_CLIENT_NOT_FOUND = 1;
  SET_PASSWORD_ALREADY_SET = 2;
}

message SetPasswordRequest {
  string ClientId = 1;
  string Password = 2;
}

message SetPasswordResponse {
  SetPasswordStatusGrpc Status = 1;
}

enum VerifyPasswordStatusGrpc {
  VERIFY_OK = 0;
  VERIFY_INVALID_CREDENTIALS = 1;
  VERIFY_PASSWORD_NOT_SET = 2;
}

message VerifyPasswordRequest {
  string Email = 1;
  string Password = 2;
}

message VerifyPasswordResponse {
  VerifyPasswordStatusGrpc Status = 1;
  optional string ClientId = 2;
}

message GetClientByEmailRequest {
  string Email = 1;
}

message GetClientByIdRequest {
  string Id = 1;
}

message GetClientResponse {
  optional AcademyClientGrpcModel Client = 1;
}

enum GenerateResetCodeStatusGrpc {
  GENERATE_RESET_CODE_OK = 0;
  GENERATE_RESET_CODE_CLIENT_NOT_FOUND = 1;
}

message GenerateResetCodeRequest {
  string Email = 1;
}

message GenerateResetCodeResponse {
  GenerateResetCodeStatusGrpc Status = 1;
  optional string ClientId = 2;
  optional string Code = 3;
  optional int64 ExpiresAt = 4;
}

enum ResetPasswordWithCodeStatusGrpc {
  RESET_PASSWORD_OK = 0;
  RESET_PASSWORD_CLIENT_NOT_FOUND = 1;
  RESET_PASSWORD_INVALID_CODE = 2;
  RESET_PASSWORD_EXPIRED = 3;
}

message ResetPasswordWithCodeRequest {
  string Email = 1;
  string Code = 2;
  string NewPassword = 3;
}

message ResetPasswordWithCodeResponse {
  ResetPasswordWithCodeStatusGrpc Status = 1;
}

message ListClientsRequest {
  int32 Limit = 1;
  int32 Offset = 2;
  optional string EmailQuery = 3;
}

message ListClientsResponse {
  repeated AcademyClientGrpcModel Clients = 1;
}

message GetClientsByIdsRequest {
  repeated string Ids = 1;
}

message GetClientsByIdsResponse {
  repeated AcademyClientGrpcModel Clients = 1;
}

message GetClientsCountResponse {
  int64 Total = 1;
}

enum SetExternalIdStatusGrpc {
  SET_EXTERNAL_ID_OK = 0;
  SET_EXTERNAL_ID_CLIENT_NOT_FOUND = 1;
}

// External_id is Billerix buyer id. Empty string clears it.
message SetExternalIdRequest {
  string ClientId = 1;
  optional string ExternalId = 2;
}

message SetExternalIdResponse {
  SetExternalIdStatusGrpc Status = 1;
}

// Looks a client up by its external_id (payment-provider buyer id). This is the
// stable identity used to match subscription webhooks, so it survives email changes.
message GetClientByExternalIdRequest {
  string ExternalId = 1;
}

enum ChangePasswordStatusGrpc {
  CHANGE_PASSWORD_OK = 0;
  CHANGE_PASSWORD_CLIENT_NOT_FOUND = 1;
  CHANGE_PASSWORD_INVALID_OLD_PASSWORD = 2;
  CHANGE_PASSWORD_NOT_SET = 3;
}

// Self-service password change: verifies the current password before setting the new one.
message ChangePasswordRequest {
  string ClientId = 1;
  string OldPassword = 2;
  string NewPassword = 3;
}

message ChangePasswordResponse {
  ChangePasswordStatusGrpc Status = 1;
}

enum ForceSetPasswordStatusGrpc {
  FORCE_SET_PASSWORD_OK = 0;
  FORCE_SET_PASSWORD_CLIENT_NOT_FOUND = 1;
}

// Admin-only password reset: sets a new password without knowing the old one.
message ForceSetPasswordRequest {
  string ClientId = 1;
  string NewPassword = 2;
}

message ForceSetPasswordResponse {
  ForceSetPasswordStatusGrpc Status = 1;
}

enum SetNameStatusGrpc {
  SET_NAME_OK = 0;
  SET_NAME_CLIENT_NOT_FOUND = 1;
}

// Sets the client's display name. Each field is independently optional:
// absent = leave unchanged, empty string = clear the stored value.
message SetNameRequest {
  string ClientId = 1;
  optional string FirstName = 2;
  optional string LastName = 3;
}

message SetNameResponse {
  SetNameStatusGrpc Status = 1;
}

enum ChangeEmailStatusGrpc {
  CHANGE_EMAIL_OK = 0;
  CHANGE_EMAIL_CLIENT_NOT_FOUND = 1;
  CHANGE_EMAIL_ALREADY_TAKEN = 2;
}

// Changes the client's login email. NewEmail is plain text; uniqueness is enforced
// against the encrypted column. A no-op (same email) returns OK.
message ChangeEmailRequest {
  string ClientId = 1;
  string NewEmail = 2;
}

message ChangeEmailResponse {
  ChangeEmailStatusGrpc Status = 1;
}

service AcademyClientsGrpcService {
  rpc CreateClientIfNotExists(CreateClientIfNotExistsRequest) returns (CreateClientIfNotExistsResponse);
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);
  rpc VerifyPassword(VerifyPasswordRequest) returns (VerifyPasswordResponse);
  rpc GetClientByEmail(GetClientByEmailRequest) returns (GetClientResponse);
  rpc GetClientById(GetClientByIdRequest) returns (GetClientResponse);
  rpc GetClientByExternalId(GetClientByExternalIdRequest) returns (GetClientResponse);
  rpc GetClientsByIds(GetClientsByIdsRequest) returns (GetClientsByIdsResponse);
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse);
  rpc GetClientsCount(google.protobuf.Empty) returns (GetClientsCountResponse);
  rpc GenerateResetCode(GenerateResetCodeRequest) returns (GenerateResetCodeResponse);
  rpc ResetPasswordWithCode(ResetPasswordWithCodeRequest) returns (ResetPasswordWithCodeResponse);
  rpc SetExternalId(SetExternalIdRequest) returns (SetExternalIdResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc ForceSetPassword(ForceSetPasswordRequest) returns (ForceSetPasswordResponse);
  rpc ChangeEmail(ChangeEmailRequest) returns (ChangeEmailResponse);
  rpc SetName(SetNameRequest) returns (SetNameResponse);
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
}
